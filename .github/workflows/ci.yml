name: offline-checks
# Mirrors scripts/run_offline_checks.sh exactly.
# HONESTY NOTE (updated CP-CI1, 2026-10-21): the FIRST observed GitHub
# run (39587996894, on CP-L8) FAILED — this workflow's dependency list
# was missing python-dotenv (imported by server.py) and numpy (guarded
# import in core/next_candle.py), and the Phase-K battery needs the two
# committed evidence artifacts (previously gitignored). Fixed here and
# verified by a faithful fresh-clone repro (1071/1071, exit 0). A "CI
# green" claim still requires observing a real post-fix GitHub run.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install python deps (runtime + test imports)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx python-dotenv numpy
      - name: Run every offline check (temp DBs, no network, no creds)
        run: bash scripts/run_offline_checks.sh
