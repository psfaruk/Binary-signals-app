# railway.toml — RAILWAY service configuration (2026-11-26)
#
# Deploy:  railway up            (CLI, from the repo root)
#   or:    Railway Dashboard → New Project → GitHub repo → auto-detects
#          this file (Dockerfile builder) + the Volume below.
#
# REQUIRED ONE-TIME DASHBOARD SETUP (cannot live in this file):
#   1. Settings → Volumes → New Volume → mount at  /app/data
#      (db.py auto-detects it; without it every redeploy wipes signals.db)
#   2. Variables → at minimum:
#        QX_TOKEN    = <Quotex SSID token>   (or use the minter service)
#        ADMIN_KEY   = <strong secret>       (token-push + admin APIs)
#   3. Settings → Networking → Generate Domain (public URL)
#
# MINTER SERVICE (geo-unblocked token minting, same repo):
#   New service → same GitHub repo → Variables:
#        QX_SERVICE_ROLE=minter
#        QX_EMAIL / QX_PASSWORD (or QX_TOKEN seed)
#        APP_URL=<the main service's URL>   (minter pushes tokens there)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
