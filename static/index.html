<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Binary Signal Terminal</title>
  <meta http-equiv="refresh" content="0; url=/static/otc.html">
  <style>
    html.no-js .router-spinner{display:none}
    html,body{margin:0;padding:0;height:100%;width:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    #router{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;gap:18px;padding:24px;text-align:center}
    .router-title{font-size:16px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .router-sub{font-size:13px;color:#8b949e;max-width:480px;line-height:1.5}
    .router-spinner{width:34px;height:34px;border:3px solid rgba(255,193,7,.2);border-top-color:#ffc107;border-radius:50%;animation:chart-spin .7s linear infinite}
    @keyframes chart-spin{to{transform:rotate(360deg)}}
    .router-links{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}
    .router-links a{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:700;text-decoration:none;letter-spacing:.5px;text-transform:uppercase;transition:transform .12s}
    .router-links a:hover{transform:translateY(-1px)}
    .router-links a.real{background:rgba(0,200,83,.15);color:#00c853;border:1px solid rgba(0,200,83,.4)}
    .router-links a.otc{background:rgba(255,193,7,.15);color:#ffc107;border:1px solid rgba(255,193,7,.4)}
    .noscript{color:#ff1744;font-size:12px;margin-top:8px}
  </style>
</head>
<body>
<div id="router">
  <div class="router-spinner" aria-hidden="true"></div>
  <div class="router-title">Binary Signal Terminal</div>
  <div class="router-sub">Redirecting to your last-used market…</div>
  <div class="router-links">
    <a class="real" href="/static/real.html">Real Market</a>
    <a class="otc"  href="/static/otc.html">OTC Market</a>
  </div>
  <noscript><div class="noscript">JavaScript is required. Pick a market above to continue.</div></noscript>
</div>
<script>
document.documentElement.classList.remove('no-js');
(function(){'use strict';
  var category = 'otc'; // default — OTC is always open (24/7)
  try{
    var stored = localStorage.getItem('marketCategory');
    if(stored === 'real' || stored === 'otc') category = stored;
    else if(stored === 'alltime_otc'){ category = 'otc'; try{ localStorage.setItem('marketCategory','otc'); }catch(_){} }
  }catch(_){ /* localStorage may be unavailable */ }
  var targets = {'real':'/static/real.html','otc':'/static/otc.html'};
  setTimeout(function(){ window.location.replace(targets[category] || '/static/otc.html'); }, 200);
})();
</script>
</body>
</html>
